[package]
name = "vasak-text"
version = "0.2.3"
description = "El editor de texto de VasakOS"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vasak_text_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Los plugins del escritorio. Los cuatro, no dos: una app de VasakOS tiene que
# hablar el idioma de la sesión y abrir el menú del sistema con el clic derecho.
tauri-plugin-vicons = "2"
tauri-plugin-config-manager = "2"
tauri-plugin-i18n-vsk = "2.3.0"
tauri-plugin-vsk-contextual-menu = "2"
tauri-plugin-shell = "2"

# `gtk` no está a propósito, aunque la plantilla lo traiga.
#
# La barra de título propia no lo necesita: mover y maximizar salen de
# `data-tauri-drag-region` y de la API de ventana de Tauri, y este código nunca
# lo importó.
#
# Ojo con lo que esto **no** arregla: `gtk` 0.18 y `glib` 0.18 siguen en el
# Cargo.lock porque los trae Tauri por su cuenta, vía `tao`. El aviso de
# dependabot sobre `glib::VariantStrIter` sigue en pie y no se cierra desde acá;
# sale cuando Tauri actualice. Quitar esta línea es sacar una dependencia que no
# se usa, nada más. Antes de volver a agregarla, comprobar que haga falta.
tauri-plugin-vsk-journal = "2"

# El selector de archivos. **No** es `tauri-plugin-fs`: el diálogo devuelve la
# ruta que la persona eligió y nada más, mientras que `fs` con un `scope` amplio
# le da al WebView acceso declarado a todo el home. Los archivos los leen y
# escriben los comandos de `documento.rs`. El gestor de archivos ya usa este
# plugin por la misma razón.
tauri-plugin-dialog = "2"

# Una sola ventana. Abrir un `.txt` con el editor ya abierto entra como pestaña
# nueva en lugar de levantar un segundo WebKit de ~150 MB.
tauri-plugin-single-instance = "2"

# Para pedirle al escritorio que traiga la ventana al frente. En Wayland
# `set_focus` no alcanza —un cliente no puede robarse el foco— así que abrir un
# archivo con el editor ya abierto dejaba la pestaña nueva en una ventana que
# seguía atrás. `vasak-settings` resuelve lo mismo con este mensaje.
zbus = { version = "4", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Los tests de `documento.rs` escriben archivos de verdad: el guardado atómico,
# los permisos que se conservan y el archivo que cambió en disco no se pueden
# probar sin disco.
tempfile = "3"
# Sólo para el test que valida los catálogos de idioma: el plugin los parsea en
# tiempo de ejecución y **paniquea** si no puede, así que un error de sintaxis no
# se ve hasta que la aplicación no arranca.
serde_yaml = "0.9"

[features]
# Para poder probar la ventana sin el servidor de desarrollo.
#
# Sin esta feature, `tauri` sirve la interfaz desde `devUrl`, y un binario
# compilado a mano abre una ventana **vacía** sin decir nada: no hay error, no
# hay página. Con ella la interfaz sale de `dist/`, que es lo que hace el
# empaquetado. Correr `cargo build --features custom-protocol` es la forma de
# mirar la aplicación real.
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Deja que LLVM optimice mirando todo el programa a la vez.
lto = "thin"       # ~90% del beneficio de fat LTO, compilando mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Sin desenrollado de pila: binario más chico y más rápido.
strip = true       # Fuera los símbolos de depuración.

# Ojo al empaquetar: makepkg inyecta `-flto` global en CFLAGS/LDFLAGS, y los
# crates que compilan C o assembly (ring, vía rustls) emiten bitcode que el
# enlazador de rustc no resuelve. El PKGBUILD tiene que llevar `options=('!lto')`
# — Cargo ya hace su propio LTO acá arriba, así que el de makepkg es redundante
# además de dañino.
